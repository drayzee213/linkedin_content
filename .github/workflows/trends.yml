name: Trends (LinkedIn-Trends recherchieren)
on:
  schedule:
    - cron: '15 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: content-bot-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python -m bot.trends
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Zustand speichern
        if: always()
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -q -m "state: update [skip ci]"
          git pull -q --rebase && git push -q
