name: Scout (X durchsuchen, Vorschlag senden)
on:
  schedule:
    # Zeiten in UTC: 06:40, 10:40, 15:40 (= 07:40 / 11:40 / 16:40 MEZ)
    - cron: '40 6,10,15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: content-bot-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python -m bot.scout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
      - name: Zustand speichern
        if: always()
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -q -m "state: update [skip ci]"
          git pull -q --rebase && git push -q
